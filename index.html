<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GameHub</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <header>
    <h1>🎮 GameHub</h1>
    <p>Simple GitHub Pages-ready game portal</p>
    <input type="text" id="search" placeholder="Search games..."/>
  </header>

  <main id="games">
    <a class="card" href="https://example.com" target="_blank">
      <h2>Retro Bowl</h2>
      <p>Football arcade game</p>
    </a>

    <a class="card" href="https://example.com" target="_blank">
      <h2>Run 3</h2>
      <p>Endless runner in space</p>
    </a>

    <a class="card" href="https://example.com" target="_blank">
      <h2>Slope</h2>
      <p>Fast-paced rolling challenge</p>
    </a>
  </main>

  <script src="script.js"></script>
</body>
</html>
